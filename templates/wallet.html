{% extends "base.html" %}
{% block title %}Wallet — VaultCore Wallet{% endblock %}

{% block content %}

<section class="wallet-page">

  <!-- ═══ Total Balance Card ═══ -->
  <div class="wallet-balance-card">
    <div class="balance-header">
      <div class="balance-label">Total Wallet Value</div>
      <button class="btn-hide-balance" id="btnHideWallet" onclick="toggleWalletBalance()">
        <span id="walletHideIcon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
      </button>
    </div>
    <div class="balance-display">
      <span class="balance-amount" id="walletAmount">$0.00</span>
      <span class="balance-hidden" id="walletHidden">••••••</span>
    </div>
    <div class="balance-actions">
      <a href="{{ url_for('receive') }}" class="wallet-action-btn">
        <span>↓</span> Deposit
      </a>
      <a href="{{ url_for('send') }}" class="wallet-action-btn">
        <span>↑</span> Send
      </a>
      <a href="{{ url_for('market') }}" class="wallet-action-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> Trade
      </a>
    </div>
  </div>

  <!-- ═══ Holdings List ═══ -->
  <div class="wallet-section">
    <h3 class="section-title">Your Holdings</h3>
    <div class="holdings-list" id="holdingsList">
      <div class="loading-state">Total holdings…</div>
    </div>
  </div>

  <!-- ═══ Open Trades ═══ -->
  <div class="wallet-section">
    <h3 class="section-title">Open Trades</h3>
    <div class="trades-list" id="tradesList">
      <div class="loading-state">Loading trades…</div>
    </div>
  </div>

</section>

<!-- ═══ Transaction History ═══ -->
<div class="wallet-section" style="margin-top:28px">

  <div class="wallet-section-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <h3 style="font-size:15px;font-weight:700;color:var(--text-1)">Transaction History</h3>
    <!-- Filter tabs -->
    <div style="display:flex;gap:6px">
      <button class="tx-filter-btn active" data-filter="all"     onclick="setTxFilter('all')">All</button>
      <button class="tx-filter-btn"        data-filter="receive" onclick="setTxFilter('receive')">Deposits</button>
      <button class="tx-filter-btn"        data-filter="send"    onclick="setTxFilter('send')">Sends</button>
      <button class="tx-filter-btn"        data-filter="withdraw"onclick="setTxFilter('withdraw')">Withdrawals</button>
    </div>
  </div>

  <div id="txHistoryList">
    <div class="loading-state" style="padding:20px;text-align:center;font-size:13px">Loading history…</div>
  </div>

</div>

<script>
let walletVisible = true;

async function loadWallet() {
  try {
    const res = await fetch('/api/wallet-summary');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // ── Total balance ─────────────────────────────────────────
    const totalEl = document.getElementById('walletAmount');
    if (totalEl) {
      totalEl.textContent = '$' + (data.total_value || 0).toLocaleString('en-US', {
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });
    }

    // ── Holdings ──────────────────────────────────────────────
    const entries = Object.entries(data.holdings || {})
      .filter(([, h]) => h.balance > 0)
      .sort(([, a], [, b]) => b.usd_value - a.usd_value);

    if (!entries.length) {
      document.getElementById('holdingsList').innerHTML =
        '<div class="empty-state">No holdings yet. Make a deposit to get started.</div>';
    } else {
      document.getElementById('holdingsList').innerHTML = entries.map(([sym, h]) => {
        const chg    = typeof h.change_24h === 'number' ? h.change_24h : 0;
        const up     = chg >= 0;
        const chgStr = (up ? '+' : '') + chg.toFixed(2) + '%';
        const price  = h.price > 0 ? '$' + h.price.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:8}) : '—';
        return `
          <div class="holding-card">
            <div class="holding-icon coin-icon ${sym.toLowerCase()}">${sym}</div>
            <div class="holding-info">
              <div class="holding-name">${sym}</div>
              <div class="holding-amount">${h.balance.toFixed(6)} ${sym}</div>
              <div style="font-size:11px;color:var(--text-3);margin-top:2px">@ ${price}</div>
            </div>
            <div class="holding-values">
              <div class="holding-usd">$${(h.usd_value||0).toFixed(2)}</div>
              <div class="holding-chg ${up ? 'chg-up' : 'chg-down'}">${chgStr}</div>
            </div>
          </div>`;
      }).join('');
    }

    // ── Open Trades ───────────────────────────────────────────
    const openTrades = (data.open_trades || []).filter(t => t.status === 'open');
    if (!openTrades.length) {
      document.getElementById('tradesList').innerHTML =
        '<div class="empty-state">No open trades</div>';
    } else {
      document.getElementById('tradesList').innerHTML = openTrades.map(t => {
        const pnl    = typeof t.pnl === 'number' ? t.pnl : 0;
        const pnlPct = typeof t.pnl_percent === 'number' ? t.pnl_percent
                       : (t.entry_price > 0 ? ((t.current_price - t.entry_price) / t.entry_price * 100) : 0);
        const up     = pnl >= 0;
        const base   = (t.pair || '/').split('/')[0];
        const date   = t.opened_at ? new Date(t.opened_at).toLocaleDateString() : '—';
        return `
          <div class="trade-card">
            <div class="trade-header">
              <span class="trade-pair">${t.pair}</span>
              <span class="trade-side ${(t.side||'').toLowerCase()}">${t.side}</span>
            </div>
            <div class="trade-details">
              <div class="trade-row"><span class="trade-label">Amount</span><span class="trade-value">${(t.amount||0).toFixed(4)} ${base}</span></div>
              <div class="trade-row"><span class="trade-label">Entry</span><span class="trade-value">$${(t.entry_price||0).toFixed(2)}</span></div>
              <div class="trade-row"><span class="trade-label">Current</span><span class="trade-value">$${(t.current_price||0).toFixed(2)}</span></div>
              <div class="trade-row pnl-row">
                <span class="trade-label">P&L</span>
                <span class="trade-pnl ${up ? 'up' : 'down'}">
                  ${up?'+':''}$${pnl.toFixed(2)} (${up?'+':''}${pnlPct.toFixed(2)}%)
                </span>
              </div>
            </div>
            <div class="trade-footer">
              <span class="trade-time">${date}</span>
              <button class="btn-close-trade" onclick="closeTrade('${t.id}')">Close</button>
            </div>
          </div>`;
      }).join('');
    }

  } catch(e) {
    console.error('Wallet load failed:', e);
    // Show error only on holdings, not entire page
    const el = document.getElementById('holdingsList');
    if (el) el.innerHTML = '<div class="empty-state" style="color:var(--text-3)">Could not load holdings. <button onclick="loadWallet()" style="color:var(--gold);background:none;border:none;cursor:pointer;font-size:13px">Retry</button></div>';
    const tel = document.getElementById('tradesList');
    if (tel) tel.innerHTML = '<div class="empty-state">—</div>';
  }
}

function toggleWalletBalance() {
  walletVisible = !walletVisible;
  const amountEl = document.getElementById('walletAmount');
  const hiddenEl = document.getElementById('walletHidden');
  const iconEl   = document.getElementById('walletHideIcon');

  if (walletVisible) {
    amountEl.style.display = 'inline';
    hiddenEl.style.display = 'none';
    iconEl.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  } else {
    amountEl.style.display = 'none';
    hiddenEl.style.display = 'inline';
    iconEl.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  }
}

function closeTrade(id) {
  alert(`Close trade ${id} — connect to your exchange API to implement`);
}

loadWallet();

// ── Transaction History ──────────────────────────────────────────
let _currentTxFilter = 'all';
let _txData = [];

async function loadTxHistory(filter = 'all') {
  const container = document.getElementById('txHistoryList');
  if (!container) return;
  container.innerHTML = '<div class="loading-state" style="padding:20px;text-align:center;font-size:13px">Loading…</div>';

  try {
    const res  = await fetch(`/api/transactions?type=${filter}&limit=50`);
    _txData    = await res.json();
    renderTxHistory(_txData);
  } catch(e) {
    container.innerHTML = '<div class="loading-state" style="color:var(--danger);padding:20px;text-align:center">Could not load history.</div>';
  }
}

function renderTxHistory(txs) {
  const container = document.getElementById('txHistoryList');
  if (!container) return;

  if (!txs.length) {
    container.innerHTML = '<div style="padding:24px;text-align:center;font-size:13px;color:var(--text-3)">No transactions yet.</div>';
    return;
  }

  const ICONS = {
    receive:  { icon: '↓', cls: 'tx-icon-receive'  },
    send:     { icon: '↑', cls: 'tx-icon-send'      },
    withdraw: { icon: '⇡', cls: 'tx-icon-withdraw'  },
    trade:    { icon: '⇄', cls: 'tx-icon-trade'     },
  };

  const AMOUNT_CLS = {
    receive:  'tx-amount-pos',
    send:     'tx-amount-neg',
    withdraw: 'tx-amount-neg',
    trade:    'tx-amount-neu',
  };

  const SIGN = {
    receive:  '+',
    send:     '−',
    withdraw: '−',
    trade:    '',
  };

  container.innerHTML = txs.map(tx => {
    const ic    = ICONS[tx.type] || { icon: '·', cls: 'tx-icon-trade' };
    const amtCls = AMOUNT_CLS[tx.type] || 'tx-amount-neu';
    const sign  = SIGN[tx.type] ?? '';
    const sub   = tx.to_address
      ? `To: ${tx.to_address.slice(0,12)}…`
      : tx.notes
        ? tx.notes.slice(0, 40)
        : tx.tx_id.slice(0, 14) + '…';
    const date  = new Date(tx.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const statusPill = `<span class="tx-status-pill pill-${tx.status}">${tx.status}</span>`;

    return `
      <div class="tx-history-row">
        <div class="tx-icon ${ic.cls}">${ic.icon}</div>
        <div class="tx-row-info">
          <div class="tx-row-type">${tx.type}</div>
          <div class="tx-row-sub">${sub} · ${date}</div>
        </div>
        <div class="tx-row-right">
          <div class="tx-row-amount ${amtCls}">${sign}${parseFloat(tx.amount).toFixed(6)} ${tx.symbol}</div>
          ${statusPill}
        </div>
      </div>`;
  }).join('');
}

function setTxFilter(filter) {
  _currentTxFilter = filter;
  document.querySelectorAll('.tx-filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  loadTxHistory(filter);
}

// Auto-load on page ready
loadTxHistory('all');

</script>

{% endblock %}
