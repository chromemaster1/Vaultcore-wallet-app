{% extends "base.html" %}
{% block title %}Support — VaultCore Wallet{% endblock %}
{% block content %}

<div class="support-page">

  <div class="support-header">
    <h2>Live Support</h2>
    <p>Our team typically responds within a few minutes.</p>
  </div>

  <div class="chat-container">

    <!-- Chat header -->
    <div class="chat-header">
      <div class="chat-agent-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div>
        <div class="chat-agent-name">VaultCore Support</div>
        <div class="chat-agent-status">Online</div>
      </div>
    </div>

    <!-- Message feed -->
    <div id="chatBox" class="chat-box">
      <!-- Welcome message -->
      <div class="msg bot">
        Welcome to VaultCore Support! How can we help you today?
      </div>
    </div>

    <!-- Input -->
    <form class="chat-form" onsubmit="sendMessage(event)">
      <input id="chatInput" placeholder="Type your message…" autocomplete="off" />
      <button type="submit" class="btn-chat-send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Send
      </button>
    </form>

  </div>

</div>

<script>
const CANNED = [
  "Thanks for reaching out! A support agent will be with you shortly.",
  "I understand. Let me check that for you.",
  "For urgent issues, you can also email us at vaultcorewallet@gmail.com.",
  "Could you please provide your registered email so we can look up your account?",
  "We appreciate your patience. Our team is reviewing your case.",
];
let msgCount = 0;

function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById('chatInput');
  const box   = document.getElementById('chatBox');
  const text  = input.value.trim();
  if (!text) return;

  const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  box.innerHTML += `
    <div class="msg user">${escapeHtml(text)}</div>
    <div class="msg-time">${now}</div>`;

  input.value = '';

  setTimeout(() => {
    const reply = CANNED[msgCount % CANNED.length];
    msgCount++;
    box.innerHTML += `
      <div class="msg bot">${reply}</div>`;
    box.scrollTop = box.scrollHeight;
  }, 900 + Math.random() * 600);

  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Allow Enter to send
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.querySelector('.chat-form').dispatchEvent(new Event('submit'));
  }
});
</script>

{% endblock %}
